name: AiPlusBlockEditor Build

on:
  workflow_run:
    workflows: ["AiPlusBlockEditor CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Checkout to Master Built branch
        if: github.ref == 'refs/heads/master'
        env:
          USER_EMAIL: "badasswpdev@gmail.com"
          USER_NAME: "badasswp"
        run: |
          git config user.email "${USER_EMAIL}"
          git config user.name "${USER_NAME}"
          git checkout -b master-built

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Clear Yarn cache
        run: yarn cache clean

      - name: Build Dist folder
        run: |
          yarn install && yarn build
          git add dist/ -f
          git rm package.json

      - name: Build Vendor folder
        run: |
          composer install --no-dev
          git add vendor/ -f

      - name: Clean Up Files
        run: |
          while IFS= read -r file; do
            git rm -rf "$file"
          done < .deployignore
          git rm .deployignore
          git clean -f yarn.lock
          git clean -f node_modules
          git clean -f composer.lock

      - name: Push to Master Built
        run: |
          git commit -m "push to master-built"
          git push origin master-built -f
          rm -rf .git

      - name: Deploy to Production
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: wp-mst/wp-content/plugins/ai-plus-block-editor/
